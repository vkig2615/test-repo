name: Notify and Upload File to Slack

on:
  push:
    branches:
      - main

jobs:
  notify-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Slack notification
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"New update pushed to main!"}' ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload file to Slack
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: "YOUR_CHANNEL_ID"
        run: |
          curl -F file=@"path/to/yourfile.txt" \
               -F "initial_comment=Here is the latest file update" \
               -F channels=$CHANNEL_ID \
               -H "Authorization: Bearer $SLACK_TOKEN" \
               https://slack.com/api/files.upload
